[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haptic-ai"
version = "0.1.0"
description = "HapticWash model pipeline: data + step classifier + export"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "imbalanced-learn",
    "matplotlib",
    "pyyaml",
    "pydantic",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
# Deep-learning / TFLite export stack. Framework choice is deferred to M2 (SPEC 2.2);
# only the M0 stub model needs it before then. tensorflow-io-gcs-filesystem has no
# Windows wheels, so this extra is Linux-only and model export runs on Linux/CI.
ml = ["tensorflow==2.17.* ; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest", "ruff", "jupyter", "jsonschema"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
