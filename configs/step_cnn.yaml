# M2 1D CNN: LOSO on uwash, external test on zhang_who (D15). Keras (D21). Runs on Linux.
# Frozen contract values (SPEC 1.3 / 8.2): 7 outputs, 50 Hz, channels ax..gz.
seed: 0
window_sizes_s: [2.0, 3.0, 5.0]   # SPEC M2 sweep
overlap: 0.5
moving_average_s: [2.0, 3.0]      # causal smoothing, in seconds (D21)
models: [cnn, cnn_aug]            # cnn_aug = cnn + D10 augmentation
cnn:
  epochs: 30
  batch_size: 256               # CPU is faster than the GPU for this model (D21)
  learning_rate: 0.002          # scaled with the batch size; not tuned
augment:                          # D10; training only
  rotate_deg: 15
  scale: [0.5, 1.5]
  jitter: 0.05
