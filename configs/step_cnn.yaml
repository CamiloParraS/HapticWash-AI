# Step CNN configuration.
# Stub — M2 owns this file (window-size sweep {2,3,5}s, model comparison). Frozen
# contract values below come from SPEC 1.3 / 8.2 and must not be re-tuned here.
model:
  type: cnn1d
  num_classes: 7        # SPEC 1.3 (NULL + 5 WHO steps + WASH_OTHER)

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001

preprocessing:
  sample_rate_hz: 50    # SPEC 8.2
  window_size_s: 3.0    # M2 sweeps {2.0, 3.0, 5.0}
  window_stride_s: 1.5
